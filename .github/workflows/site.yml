name: Website

# Publishes site/ to GitHub Pages. Only from a public repository: a private one never publishes it.
on:
  push:
    branches: [main]
    paths: ['site/**', 'addon/nidorama/screenshots/**', 'public/icon.svg', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the pages together
        run: |
          mkdir -p _site/screenshots
          cp site/* _site/
          cp public/icon.svg _site/
          cp addon/nidorama/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
