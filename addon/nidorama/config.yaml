name: Nidorama
version: "0.21.0"
slug: nidorama
description: Floor-plan home controller — look down into your home and tap the things in it.
url: https://github.com/Nidorrery/Nidorama
arch:
  - aarch64
  - amd64
image: ghcr.io/nidorrery/nidorama-addon-{arch}
init: false
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:floor-plan
panel_title: Nidorama
homeassistant_api: true
# Shared files (photos, 3D models, renders, your model library) live in /share/nidorama,
# so you can see and add to them with the Samba or File editor add-ons.
map:
  - share:rw
ports:
  8099/tcp: 8765
ports_description:
  8099/tcp: Nidorama on the LAN (wall tablets, browsers)
options:
  lan_without_login: false
schema:
  lan_without_login: bool
